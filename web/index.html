<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThunderEngine Web</title>
<style>
  :root {
    --bg: #ffffff; --text: #2b2f36; --muted: #5c6370; --line: #e3e6ea; --field: #d0d4da; --soft: #f1f3f5;
    --accent: #1f5fd6; --accent-hover: #184cb0; --link: #1f5fd6; --link-hover: #184cb0;
    --ring: rgba(31, 95, 214, 0.15); --error: #d92d20; --success: #188038;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --overlay-text: #cfd5dc; --overlay-line: rgba(255, 255, 255, 0.18); --overlay-bg: #0d1216;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c3036; --field: #3a3f46; --soft: #22252a;
      --accent: #2f6be0; --accent-hover: #3d7bf2; --link: #6ea2ff; --link-hover: #8fb6ff;
      --ring: rgba(110, 162, 255, 0.2); --error: #ff6b6b; --success: #4cc27a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c3036; --field: #3a3f46; --soft: #22252a;
    --accent: #2f6be0; --accent-hover: #3d7bf2; --link: #6ea2ff; --link-hover: #8fb6ff;
    --ring: rgba(110, 162, 255, 0.2); --error: #ff6b6b; --success: #4cc27a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--overlay-bg); color: var(--text); font: 15px/1.4 var(--font); overflow: hidden; }
  #view, #vol { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #vol { cursor: grab; }
  #vol[hidden], #view[hidden] { display: none; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .checks label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 13px; }
  .checks input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #hud { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font: 13px var(--mono);
    color: var(--overlay-text); text-shadow: 0 0 3px #000; pointer-events: none; white-space: pre; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; background: var(--bg); border-left: 1px solid var(--line);
    overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  #panel.hidden { transform: translateX(100%); }
  #toggle { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 332px; width: 44px; height: 44px;
    border: 1px solid var(--field); border-radius: 4px; background: var(--bg); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
  #toggle.closed { right: 12px; }
  #toggle:hover { border-color: var(--link); color: var(--link); }
  #toggle svg { stroke: currentColor; fill: none; stroke-width: 1.5; }
  .grp { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
  .grp:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .cap { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .langrow { justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .langrow .cap { margin: 0; }
  select.lang { width: auto; height: 28px; padding: 0 6px; font-size: 13px; }
  /* упоминание и ссылка на исходники - обязательны (AGPL-3.0, NOTICE 7(b)) */
  .credit { font-size: 12px; color: var(--muted); margin: 16px 0 0; }
  .credit a { color: var(--muted); text-decoration: underline; }
  .row { display: flex; gap: 8px; align-items: center; }
  .val { font: 13px var(--mono); min-width: 64px; text-align: right; }
  input[type="range"] { flex: 1; width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
  select { height: 44px; width: 100%; padding: 0 8px; border: 1px solid var(--field); border-radius: 4px;
    background: var(--bg); color: var(--text); font: 15px var(--font); }
  select:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px var(--ring); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .btn { height: 44px; width: 100%; padding: 0 12px; border: 1px solid var(--field); border-radius: 4px; background: var(--bg);
    color: var(--text); font: 500 15px var(--font); cursor: pointer; }
  .btn:hover { border-color: var(--link); color: var(--link); }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.on:hover { background: var(--accent-hover); }
  .btn:disabled { color: var(--muted); border-color: var(--line); cursor: default; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
  .chips .btn { padding: 0 4px; font-size: 13px; }
  .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .grp .cap + .row { margin-bottom: 8px; }
  [hidden] { display: none !important; }
  .kv table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kv td { padding: 4px 0; border-top: 1px solid var(--line); }
  .kv td:last-child { text-align: right; font-family: var(--mono); }
  .ok { color: var(--success); } .bad { color: var(--error); }
  #legend { width: 100%; height: 36px; display: block; }
  .nogpu { position: fixed; top: 0; left: 0; right: 320px; bottom: 0; overflow: auto; padding: 24px 24px 32px;
    background: var(--bg); color: var(--text); z-index: 5; }
  .nogpu > * { max-width: 560px; }
  .nogpu h2 { font-size: 20px; margin: 0 0 8px; }
  .nogpu h3 { font-size: 15px; margin: 16px 0 6px; }
  .nogpu p { margin: 0 0 8px; }
  .nogpu .muted { color: var(--muted); }
  .nogpu ol { margin: 0; padding-left: 20px; }
  .nogpu li { margin: 4px 0; }
  .nogpu code { font: 13px var(--mono); background: var(--soft); padding: 1px 4px; border-radius: 3px; word-break: break-all; user-select: all; }
  .nogpu details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
  .nogpu summary { cursor: pointer; color: var(--link); }
  .nogpu .btn { margin-top: 16px; width: auto; padding: 0 20px; }
  @media (max-width: 640px) {
    #panel { top: auto; left: 0; width: auto; height: 50%; border-left: 0; border-top: 1px solid var(--line); }
    .nogpu { right: 0; bottom: 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50; }
    #panel.hidden { transform: translateY(100%); }
    #toggle, #toggle.closed { right: 12px; }
    #hud { bottom: calc(50% + 12px); }
    #hud.low { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { #panel, #toggle { transition: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="vol" hidden></canvas>
<div id="hud"></div>
<button id="toggle" aria-label="Панель">
  <svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
</button>
<aside id="panel">
  <div class="grp">
    <div class="row langrow"><label class="cap" for="scen">Сценарий</label><select id="lang" class="lang"></select></div>
    <select id="scen"></select>
    <p class="note" id="summary"></p>
  </div>
  <div class="grp seg" id="mode">
    <button class="btn" data-m="2d">Срезы</button><button class="btn" data-m="3d">Объём</button>
  </div>
  <div class="grp" id="grp2d">
    <label class="cap" for="layer">Слой</label>
    <select id="layer"></select>
    <canvas id="legend"></canvas>
    <div class="checks">
      <label id="compRow"><input type="checkbox" id="composite">Композит</label>
      <label><input type="checkbox" id="arrows">Стрелки ветра</label>
    </div>
  </div>
  <div class="grp" id="grp3d" hidden>
    <div class="checks" id="surfs"></div>
    <label class="cap" for="cloudThr">Порог облака</label>
    <div class="row"><input type="range" id="cloudThr" min="0" max="100"><span class="val" id="cloudThrv"></span></div>
    <label class="cap" for="tornThr">Порог торнадо</label>
    <div class="row"><input type="range" id="tornThr" min="0" max="100"><span class="val" id="tornThrv"></span></div>
    <label class="cap" for="vscale">Растяжение по вертикали</label>
    <div class="row"><input type="range" id="vscale" min="1" max="6" step="0.5" value="2"><span class="val" id="vscalev">×2</span></div>
    <div class="seg" id="camMode"><button class="btn" data-c="orbit">Сверху</button><button class="btn" data-c="ground">С земли</button></div>
  </div>
  <div class="grp" id="levelGrp">
    <label class="cap" for="level" id="levelCap">Высота среза</label>
    <div class="row"><input type="range" id="level" min="0" max="39" value="0"><span class="val" id="levelv"></span></div>
  </div>
  <div class="grp" id="tlGrp">
    <label class="cap" for="tl">Шкала времени</label>
    <div class="row"><input type="range" id="tl" min="0" max="0" value="0" disabled><span class="val" id="tlv">вживую</span></div>
  </div>
  <div class="grp">
    <label class="cap">Скорость</label>
    <div class="chips" id="speed">
      <button class="btn" data-n="0">Пауза</button><button class="btn" data-n="1">×1</button><button class="btn" data-n="4">×4</button><button class="btn" data-n="16">×16</button>
    </div>
  </div>
  <div class="grp three">
    <button class="btn" id="stepOnce">Шаг</button>
    <button class="btn" id="reset">Сначала</button>
    <button class="btn" id="verify">Сверить</button>
  </div>
  <div class="grp kv"><table id="kv"></table></div>
  <p class="credit"><a href="https://github.com/defds7721-cyber/thunderengine-web" target="_blank" rel="noopener">ThunderEngine</a> · AGPL-3.0 · <a href="https://github.com/defds7721-cyber/thunderengine-web" target="_blank" rel="noopener">Исходный код</a></p>
</aside>
<script type="module">
const { langSwitch } = await import('./i18n.js');
langSwitch(document.getElementById('lang'));
import("./view.js?v=" + Date.now());
</script>
</body>
</html>
