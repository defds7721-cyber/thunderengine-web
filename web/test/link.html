<html lang="ru"><head><meta charset="utf-8"><title>Ссылка на пресет</title></head><body><script type="module">
// Пресет -> ссылка -> пресет: всё поле в поле, длина ссылки.
const out = s => window.webkit?.messageHandlers?.out?.postMessage(s);
window.onunhandledrejection = e => out('ОШИБКА ' + (e.reason?.stack || e.reason));
const v = '?v=' + Date.now();
const P = await import('../presets.js' + v), T = await import('../thermo.js' + v);
const text = await (await fetch('../../data/presets/supercell.json')).text();
const spec = { mode: 'params', params: { ...T.DEFAULT_PARAMS, qvPbl: 16 }, wind: { ...T.DEFAULT_WIND } };
const snd = T.soundingText(T.paramProfile(spec.params, T.levelHeights(22000)), spec.wind);
const p = { title: 'проверка «ссылки»', base: 'supercell', text, sounding: snd, sndSpec: spec, sndPrev: { isnd: '5' } };
const code = await P.presetToLink(p);
const back = await P.presetFromLink(code);
const same = JSON.stringify(back) === JSON.stringify(p);
out(`длина ссылки ${code.length} символов (зондировка ${snd.length}, конфиг ${text.length})`);
out(same ? 'ИТОГ: пресет вернулся целиком' : 'ИТОГ: РАЗОШЛОСЬ');
out('ГОТОВО');
</script></body></html>
