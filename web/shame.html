<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThunderEngine - доска почёта</title>
<style>
  :root {
    --bg: #ffffff; --text: #2b2f36; --muted: #5c6370; --line: #e3e6ea; --field: #d0d4da; --soft: #f1f3f5;
    --accent: #1f5fd6; --accent-hover: #184cb0; --link: #1f5fd6; --link-hover: #184cb0;
    --ring: rgba(31, 95, 214, 0.15); --error: #d92d20; --success: #188038;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c3036; --field: #3a3f46; --soft: #22252a;
      --accent: #2f6be0; --accent-hover: #3d7bf2; --link: #6ea2ff; --link-hover: #8fb6ff;
      --ring: rgba(110, 162, 255, 0.2); --error: #ff6b6b; --success: #4cc27a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --text: #e6e8eb; --muted: #9aa1ab; --line: #2c3036; --field: #3a3f46; --soft: #22252a;
    --accent: #2f6be0; --accent-hover: #3d7bf2; --link: #6ea2ff; --link-hover: #8fb6ff;
    --ring: rgba(110, 162, 255, 0.2); --error: #ff6b6b; --success: #4cc27a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.5 var(--font);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  header .wrap { min-height: 56px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .logo { font-weight: 600; font-size: 17px; color: var(--text); }
  /* упоминание и ссылка на исходники - обязательны (AGPL-3.0, NOTICE 7(b)) */
  .credit { font-size: 12px; color: var(--muted); padding-bottom: 24px; }
  .credit a { color: var(--muted); text-decoration: underline; }
  select.lang { width: auto; height: 32px; margin-left: auto; padding: 0 8px; font-size: 13px; }
  nav { display: flex; gap: 24px; align-self: stretch; position: relative; }
  nav a { display: flex; align-items: center; color: var(--muted); }
  nav a[aria-current="page"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  main { padding: 32px 0 40px; }
  .top { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: 16px 24px; align-items: end; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  label.cap { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select { height: 44px; width: 100%; padding: 0 12px; border: 1px solid var(--field); border-radius: 4px;
    font: 15px var(--font); color: var(--text); background: var(--bg); }
  input:focus, select:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px var(--ring); }
  input.bad, select.bad { border-color: var(--error); }
  .btn { height: 44px; padding: 0 20px; border-radius: 4px; font: 500 15px var(--font); cursor: pointer;
    border: 1px solid var(--field); background: var(--bg); color: var(--text); white-space: nowrap; }
  .btn:hover { border-color: var(--link); color: var(--link); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn:disabled { color: var(--muted); border-color: var(--line); background: var(--bg); cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .cols { display: grid; grid-template-columns: 1fr 380px; gap: 40px; margin-top: 32px; align-items: start; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 24px; }
  .sec { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 24px; }
  .sec:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
  .sec h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
  .sec h2 span { font: 13px var(--mono); color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
  .fld label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .fld label b { font: 13px var(--mono); font-weight: 400; color: var(--text); }
  .fld .note { font-size: 13px; margin-top: 2px; }
  .np { color: var(--error); } .sub { color: var(--muted); }
  .doc { white-space: pre-wrap; font: 13px/1.45 var(--mono); color: var(--text); background: var(--soft);
    border-radius: 4px; padding: 12px; max-height: 360px; overflow: auto; margin: 0; }
  .kv { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kv td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .kv td:last-child { text-align: right; font-family: var(--mono); }
  .msg { font-size: 15px; }
  .msg.err { color: var(--error); } .msg.ok { color: var(--success); }
  .inv h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 12px 0 4px; }
  .inv ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .chk { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hidden { display: none !important; }
  #sndPanel { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
  #sndPanel .head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  #sndPanel .head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  #sndPanel .src { font-size: 13px; color: var(--muted); }
  .snd { margin-top: 12px; }
  .snd-plots { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .skewt { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; }
  .hodo { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; }
  .snd-idx { margin-top: 12px; }
  .snd-ctl { margin-top: 16px; }
  .snd-ctl h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
  .snd-hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--field); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .seg button { height: 36px; padding: 0 16px; border: 0; background: var(--bg); color: var(--text); font: 15px var(--font); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--field); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  input[type=range] { height: 28px; padding: 0; border: 0; accent-color: var(--accent); }
  input[type=range]:focus { box-shadow: none; }
  @media (max-width: 900px) {
    .snd-plots { grid-template-columns: 1fr; }
    .cols { grid-template-columns: 1fr; }
    .side { position: static; }
    .top { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .shame { width: 100%; border-collapse: collapse; margin-top: 16px; }
  .shame th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
  .shame td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .shame td.when { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .shame td.what { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .flag { font-size: 18px; margin-right: 8px; }
  .lead { color: var(--muted); max-width: 720px; }
  .empty { padding: 24px 0; color: var(--muted); }
  h1 { font-size: 24px; margin: 0 0 8px; }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="logo">ThunderEngine</span>
  <nav><a href="index.html">Гроза</a><a href="editor.html">Пресеты</a><a href="shame.html" aria-current="page">Доска почёта</a></nav>
  <select id="lang" class="lang"></select>
</div></header>
<main><div class="wrap">
  <h1>Доска почёта</h1>
  <p class="lead">Боты, которые нашли в этом репозитории ключ-приманку и попробовали им воспользоваться. Ключ ничего не открывает. Последние 10.</p>
  <div id="board"></div>
  <p class="lead" id="checks"></p>
  <p class="lead" id="updated"></p>
</div></main>
<footer class="wrap credit"><a href="https://github.com/defds7721-cyber/thunderengine-web" target="_blank" rel="noopener">ThunderEngine</a> · AGPL-3.0 · <a href="https://github.com/defds7721-cyber/thunderengine-web" target="_blank" rel="noopener">Исходный код</a></footer>
<script type="module">
// Доска почёта: попытки воспользоваться ключом-приманкой из .env.
// Данные - data/shame.json (собирает .github/workflows/shame.yml раз в час):
//   { updated, checks, entries: [{ time, cc, action }] } - только страна, без IP.
const { langSwitch, T, LANG } = await import('./i18n.js');
langSwitch(document.getElementById('lang'));
const $ = id => document.getElementById(id);
let data = { entries: [], checks: 0, updated: null };
try { data = await (await fetch('../data/shame.json', { cache: 'no-store' })).json(); } catch {}
const names = new Intl.DisplayNames([LANG], { type: 'region' });
const flag = cc => /^[A-Z]{2}$/.test(cc || '') ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏴';
const when = t => new Date(t).toLocaleString(LANG === 'en' ? 'en-GB' : 'ru-RU', { dateStyle: 'medium', timeStyle: 'short' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const rows = (data.entries || []).slice(0, 10);
$('board').innerHTML = rows.length
  ? `<table class="shame"><thead><tr><th>Когда</th><th>Откуда</th><th>Чем лез</th></tr></thead><tbody>${rows.map(e =>
    `<tr><td class="when">${esc(when(e.time))}</td><td><span class="flag">${flag(e.cc)}</span>${esc(e.cc ? names.of(e.cc) : T('неизвестно'))}</td><td class="what">${esc(e.action || '-')}</td></tr>`).join('')}</tbody></table>`
  : '<p class="empty">Пока никто не попался.</p>';
if (data.checks) $('checks').textContent = `${T('Проверки служб безопасности GitHub и AWS, не в счёт')}: ${data.checks}`;
if (data.updated) $('updated').textContent = `${T('Обновлено')}: ${when(data.updated)}`;
</script>
</body>
</html>
